<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FateGrid - 九宮格命理風水探索</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 360px;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            box-sizing: border-box;
            text-align: center;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1;
        }
        .cell {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .cell:active {
            background: #3a3a3a;
        }
        .cell .pos {
            font-size: 10px;
            color: #888;
            margin-bottom: 4px;
        }
        .cell .element {
            font-size: 18px;
            font-weight: bold;
        }
        .log {
            width: 100%;
            max-width: 360px;
            margin-top: 16px;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 13px;
            min-height: 80px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0 0 8px 0; font-size:18px;">FateGrid 九宮格</h2>
        <div style="font-size:12px; color:#aaa;">點擊方格觸發風水共鳴與八字能量</div>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="log" id="log">提示：請點擊上方任意方格開始探索...</div>

    <script>
        const gridData = [
            { pos: "巽 (東南)", name: "木", color: "#4CAF50" },
            { pos: "離 (正南)", name: "火", color: "#F44336" },
            { pos: "坤 (西南)", name: "土", color: "#FF9800" },
            { pos: "震 (正東)", name: "木", color: "#8BC34A" },
            { pos: "中宮",     name: "土", color: "#FFC107" },
            { pos: "兌 (正西)", name: "金", color: "#9E9E9E" },
            { pos: "艮 (東北)", name: "土", color: "#CDDC39" },
            { pos: "坎 (正北)", name: "水", color: "#2196F3" },
            { pos: "乾 (西北)", name: "金", color: "#E0E0E0" }
        ];

        const gridEl = document.getElementById("grid");
        const logEl = document.getElementById("log");

        gridData.forEach((item, index) => {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.innerHTML = `<div class="pos">${item.pos}</div><div class="element" style="color:${item.color}">${item.name}</div>`;
            cell.onclick = () => {
                logEl.innerHTML = `已選擇：<b>${item.pos}</b> [屬性：<span style="color:${item.color}">${item.name}</span>]<br>觸發區域能量共鳴！`;
            };
            gridEl.appendChild(cell);
        });
    </script>
</body>
</html>
